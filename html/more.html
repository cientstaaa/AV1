        <h1>-----------------------------------------------------------Autores
            Brasileiros---------------------------------------------------------</h1>

        <fieldset>
            <h3><b>Mario de Andrade</b></h3>
            <img src="../img/mariodeandrade.png">
            <figcaption>
                <p>Mário de Andrade foi um escritor modernista, crítico literário, musicólogo, folclorista e ativista
                    cultural brasileiro . <br>

                    Seu estilo literário foi inovador e marcou a primeira fase modernista no Brasil, sobretudo, pela
                    valorização da identidade e cultura brasileira. <br>

                    Ao lado de diversos artistas, ele teve um papel preponderante na organização da Semana de Arte
                    Moderna (1922). <br></p>
            </figcaption>
        </fieldset>
        <fieldset>
            <h3><b>Carlos Drumom de Andrade</b></h3>
            <img src="../img/carlosDrumom.jpg">
            <figcaption>
                <p>Carlos Drummond de Andrade foi poeta, contista e cronista brasileiro do período do modernismo. <br>

                    Considerado um dos maiores escritores do Brasil, Drummond fez parte da segunda geração modernista.
                    <br>
                    Foi precursor da chamada "poesia de 30" com a publicação da obra "Alguma Poesia".
                </p>
            </figcaption>
        </fieldset>
        <fieldset>
            <h3><b>Jõao Guimarães Rosa</b></h3>
            <img src="../img/guimaraesrosa.jpg">
            <figcaption>
                <p>Guimarães Rosa foi um dos mais importantes escritores brasileiros do modernismo, <br> além de ter seguido
                    a carreira de diplomata e médico.

                    Foi o terceiro ocupante da Cadeira <br> nº 2 da Academia Brasileira de Letras (ABL), em 1967. Fez parte
                    da terceira geração modernista, chamada de Geração de 45.</p>
            </figcaption>
        </fieldset>
